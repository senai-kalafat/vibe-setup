# vibe-setup CI — testler saf bash, dış dep yok (bkz tests/run.sh + CLAUDE.md).
# Araç "kapılar herkes için, CI zorlasın" diyor; bu workflow onu repo'nun kendisinde de uygular.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest # GNU coreutils/grep/sed/awk/find — testlerin beklediği davranış
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run.sh # *_test.sh otomatik bulunur; herhangi biri fail → job kırmızı

  shellcheck:
    runs-on: ubuntu-latest # shellcheck runner'da hazır
    # BLOCKING (warning+): ağaç error/warning seviyesinde temiz tutuluyor. `info` seviyesi HARİÇ —
    # SC2015 (`A && B || C`) bu kod tabanında 200+ yerde bilinçli desen: row/ok/bad her zaman 0 döner,
    # yani C asla A doğruyken çalışmaz. SC2094 (`render_artifact "$1" > "$1"`) de yanlış pozitif:
    # render_artifact dosyayı okumaz, write_managed zaten sadece dosya YOKken çalışır.
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --severity=warning skills/vibe-setup/scaffold.sh tests/*.sh scripts/*.sh .githooks/pre-commit .githooks/commit-msg
